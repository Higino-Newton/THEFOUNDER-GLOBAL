<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGBSchool_Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/fontawesome/css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <form >
        <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">

            <div class="cont_form d-flex justify-content-center align-items-center ">

                <div class="container-img">
                    <img src="img/Book Teamwork Education Logo Vector Image Stock Vector - Illustration of business, graduate_ 107201379.jpeg"
                        alt="Logo SGBSchool">
                </div>
                <div class="campos_login d-flex flex-column justify-content-center ">
                    <h1 class="display-1 boas_vindas mb-5">Bem Vindo</h1>
                    <div class="input-group_login">
                        <input type="text" name="username" id="username" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="input-group_login">
                        <input type="password" name="password" id="password" required>
                        <label for="password">Password</label>
                    </div>
                    <button type="submit" id="btn_login" class="btn_login btn mt-4 p-5 w-50 mb-5" onclick="Entrar(window.location.href='SGBSchool.html')">Entrar</button>
                    <p class="sign_up mt-5">Não ten-s uma conta? <a href="SGBSchool_SegCadas.html"
                            class="text-decoration-underline text-light">Cadastrar-se</a></p>
                </div>
            </div>
        </div>
    </form>

    <script src="js/script.js"></script>
    <script src="/node_modules/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
