<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Idela - Lorentz</title>
    <link rel="shortcut icon" href="./icons8_scale.ico" type="image/x-icon">
</head>
<body>
    <style>
        body{
              display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }
        .container{
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(42, 106, 165);
            width: 550px;
            border-radius: 9px;
            box-shadow: 0 0 4px 3px rgba(0, 0, 0, 0.219);
        }
        input{
            padding: 10px;
            margin: 12px;
            width: 280px;
            border: none;
            background-color: #ffffff;
            outline: none;
            border-radius: 5px;
            font-size: 15px;
        }
        span{
            margin: 0;
            padding: 0;
            position: relative;
            top: -49px;
        }
        button{
            padding: 12px;
            width: 160px;
            margin: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: none;
            background-color: #ffffff;
            font-size: 17px;
            transition: .5s;
        }
        button:hover{
            background-color: #ffffffd0;
        }
        h2{
            font-size: 20px;
        }
        p{
            font-size: 12px;
            color: #ffffff63;
        }
        img{
            margin: 12px;
        }
        h1{
            position: relative;
            top: -27px;
        }
    </style>
    <div class="container">
        <img src="./icons8_weight_kg.ico" alt="">
        <h1>CALCULO DO PESO IDEAL</h1>
        <span>Teorema de Lorentz</span>

        <input type="text" id="altura" placeholder="Inseri a sua altura em metros (m)">
        <input type="text" id="sexo" placeholder="Inseri o seu sexo">
        <h2 id="pesoideal"></h2>
        <button onclick="Calcularpeso()">Calcular</button>
        <p>Made by &copy;NewtonDevCode</p>
    </div>

    <script>
        function Calcularpeso(){
            let inpaltura = document.getElementById('altura')
            let inpsexo = document.getElementById('sexo')
            let peso = document.getElementById('pesoideal')
            let altura = Number(inpaltura.value)
            altura *=100
            let sexo = inpsexo.value
            if(altura == "" || sexo==""){
                 peso.textContent = "Por favor inseri a altura ou o sexo"
                return
            } else if(sexo == "Masculino"){
                   let result1 = (altura - 100) - ((altura - 150) / 4)
                peso.textContent = "O seu peso ideal é: " + result1 + "Kg"
            } else if(sexo == "Femenino"){
                       let result2 = (altura - 100) - ((altura - 150) / 2)
                peso.textContent = "O seu peso ideal é: " + result2 + "Kg"
            }        
        }

    </script>
</body>
</html>
