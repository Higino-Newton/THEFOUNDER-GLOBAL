<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Cadastro</title>
  <link rel="stylesheet" href="css/style_nav.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="shortcut icon" href="img/LoopLogo.png" type="image/x-icon">
</head>

<body>
  <div class="topbar">
    <div class="loop">

      <div class="center">
        <div class="logo">Loop</div>
      </div>

    </div>
  </div>

  <main style="padding: 120px  14px; ">

    <div
      style="max-width:420px;margin:40px auto;background:var(--card-bg);padding:20px;border-radius:12px;box-shadow:var(--shadow)">
      <form method="post" action="" class="needs-validation" novalidate>
        <div style="text-align:center;margin-bottom:10px"><img src="img/LoopLogo.png" alt="Loop" style="width:120px">
        </div>
        <h3 class="display-6 fw-bold mb-4">Criar conta</h3>
        <input type="text" id="name" placeholder="Nome completo" class="form-control p-3 fs-3 mb-4" required>
      
        <input type="text" id="user" placeholder="Usuário" class="form-control p-3 fs-3 mb-4" required>
        <input type="email" id="email" placeholder="Email" class="form-control p-3 fs-3 mb-4" required>
    
        <input type="password" id="pass" placeholder="Senha" required class="form-control p-3 fs-3 mb-4">
  
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <a href="Loop__Login.html" class="fs-2 ms-5" style="position: relative;  top: 10px;">Logar</a>
          <button class="btn btn-warning p-4 w-50 fs-4" type="submit" window.location='Loop__Login.html'">Registrar-se</button>
         
        </div>
        </form>
      </div>

    </main>
 
  <script >
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>

</html>
